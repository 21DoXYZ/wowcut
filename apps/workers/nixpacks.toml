providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-10_x", "ffmpeg"]

[phases.install]
cmds = [
  "apt-get update -qq && apt-get install -y --no-install-recommends libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 libx11-6 libxext6 fonts-liberation 2>/dev/null || true",
  "cd ../.. && pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = [
  "cd ../.. && pnpm --filter @wowcut/db exec prisma generate",
  "cd ../.. && pnpm --filter @wowcut/workers build"
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"

[start]
cmd = "cd ../.. && pnpm --filter @wowcut/workers start"
