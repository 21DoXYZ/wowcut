providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-10_x", "ffmpeg", "nss", "nspr", "patchelf", "atk", "at-spi2-atk", "cups", "libdrm", "libxkbcommon", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXfixes", "xorg.libXrandr", "mesa", "alsa-lib", "pango", "cairo", "glib", "xorg.libX11", "xorg.libXext"]

[phases.install]
cmds = ["cd ../.. && pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = [
  "cd ../.. && pnpm --filter @wowcut/db exec prisma generate",
  "cd ../.. && pnpm --filter @wowcut/workers build",
  "cd ../.. && node -e \"require('@remotion/renderer').ensureBrowser()\" 2>&1 || npx --yes remotion browser ensure 2>&1 || true",
  "SHELL_BIN=$(find /root/.nix-profile /nix/store -name 'chrome-headless-shell' -type f 2>/dev/null | head -1); NIX_RPATH=$(find /nix/store -name 'libnspr4.so' -exec dirname {} \\; 2>/dev/null | sort -u | head -5 | tr '\\n' ':' | sed 's/:$//'); echo \"chrome-headless-shell: $SHELL_BIN, rpath dirs: $NIX_RPATH\"; if [ -n \"$SHELL_BIN\" ] && [ -n \"$NIX_RPATH\" ]; then patchelf --add-rpath \"$NIX_RPATH\" \"$SHELL_BIN\" && echo 'patchelf done'; fi"
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"

[start]
cmd = "cd ../.. && pnpm --filter @wowcut/workers start"
