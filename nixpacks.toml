providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-10_x", "ffmpeg"]

[phases.install]
cmds = [
  "apt-get update -qq && apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libdrm2 libatk-bridge2.0-0 libnspr4 libcups2 && rm -rf /var/lib/apt/lists/*",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @wowcut/db exec prisma generate",
  "pnpm --filter @wowcut/workers build",
  "ldconfig -p | grep nspr | head -2 || true"
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"

[start]
cmd = "pnpm --filter @wowcut/workers start"
