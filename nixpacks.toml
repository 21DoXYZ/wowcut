providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-10_x", "ffmpeg"]

[phases.install]
cmds = [
  "apt-get update -qq && apt-get install -y --no-install-recommends libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpangocairo-1.0-0 libx11-xcb1 && rm -rf /var/lib/apt/lists/*",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @wowcut/db exec prisma generate",
  "pnpm --filter @wowcut/workers build",
  "ldconfig -p | grep nspr | head -2 || true"
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"

[start]
cmd = "pnpm --filter @wowcut/workers start"
